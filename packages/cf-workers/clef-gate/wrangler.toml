name = "clef-gate"
account_id = "e83f342a6c0f6e20b80697363714bf7b"
main = "src/index.ts"
compatibility_date = "2026-09-11"
workers_dev = true

[[kv_namespaces]]
binding = "CLEF_KV"
id = "67bb2436719d4e39840b470fcf11ce64"

[ai]
binding = "AI"

[vars]
AI_GATEWAY_ID = "clef-shadow-gate"
CLEF_EMAIL_DAILY_CALL_CAP = "1000"
CLEF_DEFAULT_MODE = "shadow"

CLEF_EMAIL_BATCH_SIZE = "20"

[[durable_objects.bindings]]
name = "CLEF_BATCHER"
class_name = "ClefEmailBatcher"

[[migrations]]
tag = "v1-clef-email-batcher"
new_sqlite_classes = ["ClefEmailBatcher"]

[observability]
enabled = true
head_sampling_rate = 1

# Secret (name only — set with `wrangler secret put`, never committed):
# CLEF_EMAIL_SHADOW_TOKEN
#
# Kill switch (KV, binding CLEF_KV): clef:mode:global = off | shadow ; clef:mode:clef_email = off | shadow
