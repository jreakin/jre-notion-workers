name = "notion-comments-relay"
account_id = "e83f342a6c0f6e20b80697363714bf7b"
main = "src/index.ts"
compatibility_date = "2026-09-11"
workers_dev = true

[[kv_namespaces]]
binding = "RELAY_KV"
id = "108f8eb2447e4f41aa5ab76de3cfcad0"


[ai]
binding = "AI"

[vars]
FLEET_LOCKS_DATA_SOURCE_ID = "6e0a45b3-eb3f-448f-b215-49e002bfeff3"
AI_GATEWAY_ID = "clef-shadow-gate"
GATE_LOG_DATA_SOURCE_IDS = "af0ab5b0-2d9d-42bb-9621-526198146e46,b25a26f0-5464-476b-afb3-da4257e2a53b"
SUBMITTED_PROPERTY_IDS = ";Xo<"
JOHN_NOTION_USER_IDS = "2e7d872b-594c-8161-92a2-00024b29e816"
FLEET_COMMENTS_BOT_NOTION_USER_IDS = "3d87d7f5-6298-8165-8af9-0027a153ccbd"
CLEF_DAILY_CALL_CAP = "2000"
# Durable gate log: batched KV ring gate_log:v1:* (see README "Gate log KV ring"). <1k KV writes/day budget.
WAKE_GATE_KV_RING = "1"
CLEF_RING = "1"
GATE_LOG_DAILY_WRITE_CAP = "60"
# Echo filter (LOCK-69): tracked data sources for the untracked-property rule (Notion Steward's list):
# Fleet Locks, AD Docs, Fleet: Artifacts, The Enterprise: Artifacts. Unset/empty ⇒ rule fails open.
TRACKED_DATA_SOURCE_IDS = "6e0a45b3-eb3f-448f-b215-49e002bfeff3,2e97d7f5-6298-804c-b8a5-000b18b72684,fb951b3e-3033-41b8-9214-a66619e1776a,74fc2205-005a-43b7-b563-0cb658d906d3"

# Durable gate_log buffer (SQLite-backed DO, Workers Free compatible). See README "Gate log KV ring".
[[durable_objects.bindings]]
name = "GATE_LOG_DO"
class_name = "GateLogBuffer"

[[migrations]]
tag = "v1-gate-log-buffer"
new_sqlite_classes = ["GateLogBuffer"]

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/1 * * * *"]

# Optional shadow wake gate (names only — set via wrangler secret):
# NOTION_API_TOKEN, JOHN_NOTION_USER_IDS, FLEET_COMMENTS_BOT_NOTION_USER_IDS,
# SUBMITTED_PROPERTY_IDS, WAKE_GATE_KV_RING

# WAKE_GATE_DEDUPE=1 enables shadow dedupe KV puts (default off).
#
# Real cross-request Day Log serialization needs a Durable Object (not enabled):
# [[durable_objects.bindings]]
# name = "DAY_LOG_SERIALIZER"
# class_name = "DayLogSerializer"
# [[migrations]]
# tag = "v1-day-log-serializer"
# new_classes = ["DayLogSerializer"]
