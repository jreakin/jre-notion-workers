name = "notion-comments-relay"
main = "src/index.ts"
compatibility_date = "2026-09-11"
workers_dev = true

[[kv_namespaces]]
binding = "RELAY_KV"
id = "REPLACE_WITH_RELAY_KV_NAMESPACE_ID"  # live: 108f8eb2447e4f41aa5ab76de3cfcad0


[ai]
binding = "AI"

[vars]
FLEET_LOCKS_DATA_SOURCE_ID = "6e0a45b3-eb3f-448f-b215-49e002bfeff3"
AI_GATEWAY_ID = "clef-shadow-gate"
GATE_LOG_DATA_SOURCE_IDS = "af0ab5b0-2d9d-42bb-9621-526198146e46,b25a26f0-5464-476b-afb3-da4257e2a53b"
GATE_LOG_BOT_NOTION_USER_IDS = "3d87d7f5-6298-8165-8af9-0027a153ccbd"
CLEF_DAILY_CALL_CAP = "2000"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/1 * * * *"]

# Optional shadow wake gate (names only — set via wrangler secret):
# NOTION_API_TOKEN, JOHN_NOTION_USER_IDS, FLEET_COMMENTS_BOT_NOTION_USER_IDS,
# SUBMITTED_PROPERTY_IDS, WAKE_GATE_KV_RING

# WAKE_GATE_DEDUPE=1 enables shadow dedupe KV puts (default off).
#
# Real cross-request Day Log serialization needs a Durable Object (not enabled):
# [[durable_objects.bindings]]
# name = "DAY_LOG_SERIALIZER"
# class_name = "DayLogSerializer"
# [[migrations]]
# tag = "v1-day-log-serializer"
# new_classes = ["DayLogSerializer"]
