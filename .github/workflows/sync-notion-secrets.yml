name: Sync Notion Worker Secrets

# Push production worker env vars from a 1Password Environment to Notion Workers
# (ntn workers env push). Configure GitHub Environment "notion-workers-production"
# before first run — see jre-notion-workers/docs/GITHUB-SECRETS-SYNC.md

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List keys that would be pushed without calling Notion
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'jre-notion-workers/scripts/worker-env-keys.txt'
      - 'jre-notion-workers/scripts/sync-notion-worker-secrets.sh'
      - '.github/workflows/sync-notion-secrets.yml'

concurrency:
  group: sync-notion-worker-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: notion-workers-production
    defaults:
      run:
        working-directory: jre-notion-workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `op environment read` is a beta 1Password CLI feature (2.33.0-beta.02+).
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v4
        with:
          version: latest-beta

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Notion CLI
        working-directory: .
        run: bash scripts/install-ntn.sh

      - name: Sync worker secrets to Notion
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_AS_CODE_ENVIRONMENT_ID: ${{ secrets.OP_AS_CODE_ENVIRONMENT_ID }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_KEYRING: '0'
          SOURCE: op-environment
          OP_ENVIRONMENT_ID: i6ul2k6tk5kzyszv465wzhdpnu
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          PATH: ${{ env.HOME }}/.local/bin:${{ env.PATH }}
        run: bash scripts/sync-notion-worker-secrets.sh
