name: Sync Notion Worker Secrets

# Push production worker env vars from 1Password to Notion Workers (ntn workers env push).
# Configure GitHub Environment "notion-workers-production" before first run — see
# jre-notion-workers/docs/GITHUB-SECRETS-SYNC.md

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List keys that would be pushed without calling Notion
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'jre-notion-workers/.env.1p'
      - 'jre-notion-workers/.env.example'
      - 'jre-notion-workers/scripts/worker-env-keys.txt'
      - 'jre-notion-workers/scripts/sync-notion-worker-secrets.sh'
      - '.github/workflows/sync-notion-secrets.yml'

concurrency:
  group: sync-notion-worker-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: notion-workers-production
    defaults:
      run:
        working-directory: jre-notion-workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: jre-notion-workers/.env.1p

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Notion CLI
        run: npm install -g ntn

      - name: Sync worker secrets to Notion
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_KEYRING: '0'
          SOURCE: env
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: bash scripts/sync-notion-worker-secrets.sh
