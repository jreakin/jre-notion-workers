name: CI Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment CI result
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const sha = run.head_sha;
            const conclusion = run.conclusion;
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`,
            });
            if (!pulls.data.length) return;
            const pr = pulls.data[0].number;
            const body = `## CI\n\n- conclusion: **${conclusion}**\n- sha: \`${sha.slice(0, 7)}\`\n\nQuality = \`tsc --noEmit\`. Tests = \`bun test tests/unit --coverage\` in \`jre-notion-workers/\`.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });
