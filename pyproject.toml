[project]
name = "jre-notion-workers-repo-gates"
version = "0.0.0"
description = "Minimal pytest target for verify-completion when TASK.md is present (TypeScript app uses Bun)."
requires-python = ">=3.11"
dependencies = ["pytest>=8.0", "ruff>=0.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
