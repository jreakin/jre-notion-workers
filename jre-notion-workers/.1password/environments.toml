# Which locally mounted .env files the Cursor hook should validate.
# Paths are relative to the project root. Ensure your 1Password Environment
# has a "Mount .env file" destination at one of these paths (e.g. .env.local).
# CI sync uses .env.1p via GitHub Actions — see docs/GITHUB-SECRETS-SYNC.md.
# See: https://developer.1password.com/docs/environments/local-env-file
mount_paths = [".env.local", ".env"]
